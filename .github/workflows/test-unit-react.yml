name: Unit Test(Vitest) - inf-lib-test/react
on:
    push:
jobs:
    test:
        timeout-minutes: 60
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                node-version: lts/*
            - name: Install yarn
              run: npm install -g yarn
            - name: Install dependencies
              run: yarn install
            - name: Run test
              run: yarn test:unit:react
