name: Publish to NPM
on:
    push:
        branches:
            - release
permissions:
    id-token: write
    contents: read
    packages: write
jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                ref: 'release'
                fetch-depth: 0
                token: ${{ secrets.GIT_ACCESS_TOKEN }}
            - uses: actions/setup-node@v4
              with:
                node-version: '20'
                registry-url: 'https://registry.npmjs.org/'
                always-auth: true
            - name: update npm
              run: npm install -g npm@latest
            - name: install yarn
              run: npm install -g yarn
            - name: install dependencies
              run: yarn install
            - name: GIT Setup
              run: |
                git config --global user.name "${{ secrets.GH_NAME }}"
                git config --global user.email "${{ secrets.GH_EMAIL }}"
            - name: build projects
              run: yarn build
            - name: temp commit for publish
              run: |
                git add .
                git commit -m "temp commit"
            - name: publish(inf-lib-test/react)
              run: yarn package:react:publish
            - name: publish(inf-lib-test/utils)
              run: yarn package:utils:publish